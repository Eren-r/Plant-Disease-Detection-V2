# Optional NVIDIA GPU override for Docker Desktop on Windows + WSL2.
# Prerequisite: `docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu24.04 nvidia-smi` works.
# Run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
# Can take significantly more disk space than CPU PyTorch.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_REQUIREMENTS: requirements-gpu.txt
    image: plant-disease-detection-v3:gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  streamlit:
    image: plant-disease-detection-v3:gpu
